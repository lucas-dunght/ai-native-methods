# Fact Card Template · Thẻ Sự thật Nguyên tử (v2.0)
# Mỗi card chỉ chứa DUY NHẤT MỘT khẳng định sự thật.
# Tuyệt đối không dùng em-dash, không paraphrase làm lệch con số hoặc tên riêng.

fact_id: F-YYYY-NNN
content: "Một câu khẳng định sự thật cụ thể, ngắn gọn và giữ nguyên số liệu"
exact_quote: "Câu trích dẫn nguyên văn từ tài liệu nguồn trong raw-sources/"
content_hash: "sha256:8-ky-tu-dau-cua-content-cong-exact-quote"

# Nhãn nhận định theo chuẩn Fable 5.1 Claim Discipline:
# - OBSERVED : Đọc và trích trực tiếp từ nguồn trong source-log.csv
# - DERIVED  : Tính toán từ các thẻ OBSERVED bằng công thức rõ ràng
# - PRIOR    : Kiến thức nền của mô hình chưa có nguồn trong phiên (cấm gán verified)
# - ASSUMED  : Giả định tạm thời (bắt buộc gắn vào gap-checklist.md)
claim_label: OBSERVED

sources:
  - S001
  - S002
primary_origins:
  - "https://economysea.withgoogle.com/2024"
independent_origin_count: 1

# Giá trị fact_type hợp lệ:
# numerical-claim | qualitative-claim | event | statement | definition | relationship
fact_type: numerical-claim
domain: tag-domain
role: evidence-for-thesis-1
date_extracted: YYYY-MM-DD
extracted_by: agent
notes: "Ghi chú ngữ cảnh hoặc công thức nếu claim_label là DERIVED"

# Điền ở Giai đoạn 6 (Trust Classifier & 4D Enrichment):
# Giá trị trust_tier hợp lệ: verified | probable | unverified
trust_tier: probable

enrichment:
