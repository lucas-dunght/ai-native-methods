# L1 Stored Fact Template
# Sự thật lưu sẵn, đo được, deterministic
# Lưu key-value có kiểu, có ID, có nguồn

# Trường BẮT BUỘC
fact_id: L1-domain-key-NNN
fact_type: L1
domain: tag-domain
key: unique-key-for-lookup
value: 12500000
unit: VND
source:
  type: internal-document
  document_id: source-document-identifier
  document_path: docs/path/to/source.pdf
  page: 3
  cell: B7
date_updated: YYYY-MM-DD
updated_by: human
# hoặc agent nếu agent tạo entry
status: active
# Các giá trị hợp lệ: active, deprecated, superseded

# Trường nên có
date_effective: YYYY-MM-DD
date_expires: YYYY-MM-DD
notes: "Ghi chú thêm về context của fact"

# Trường khi entry superseded entry khác
superseded_by: L1-domain-key-NNN
# Khi deprecated, không xoá entry. Đánh dấu deprecated và pointer tới entry mới

# Ví dụ
# fact_id: L1-product-price-X-2026-Q2
# domain: product-pricing
# key: product-X-retail-price-2026-Q2
# value: 12500000
# unit: VND
# source:
#   type: internal-document
#   document_id: pricing-table-2026-Q2
#   document_path: docs/pricing/pricing-table-2026-Q2.pdf
#   page: 3
#   cell: B7
# date_effective: 2026-04-01
# date_expires: 2026-06-30
# date_updated: 2026-04-01
# updated_by: human
# status: active
