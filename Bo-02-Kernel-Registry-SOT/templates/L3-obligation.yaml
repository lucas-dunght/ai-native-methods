# L3 Obligation Template
# Sinh có ràng buộc, nghĩa vụ rút từ văn bản pháp quy hoặc văn bản nội bộ chính thức
# Mỗi nguồn (nghị định, thông tư, quy chế) một file riêng

# File structure trong thư mục obligations/source-id/obligations.yaml

source_metadata:
  source_id: source-identifier
  title: "Tên đầy đủ của văn bản gốc"
  authority: "Cơ quan ban hành"
  date_issued: YYYY-MM-DD
  date_effective: YYYY-MM-DD
  date_expires: YYYY-MM-DD  # nếu có
  source_document_path: ./source-doc.pdf

obligations:
  - obligation_id: OBL-source-id-001
    description: "Mô tả nghĩa vụ rõ ràng, không mơ hồ"
    article: "Điều X, khoản Y"
    severity: high
    # Các giá trị hợp lệ: low, medium, high, critical
    applies_to: target-entity-or-role
    date_added: YYYY-MM-DD
    status: active
    notes: "Ghi chú thêm nếu cần"

  - obligation_id: OBL-source-id-002
    description: "..."
    article: "..."
    severity: medium
    applies_to: "..."
    date_added: YYYY-MM-DD
    status: active

# Lưu ý
# - Mỗi nghĩa vụ là một entry riêng có ID duy nhất
# - Mô tả phải cụ thể, không paraphrase mơ hồ
# - Article phải reference được trong văn bản gốc
# - severity là phán xét của người trích, có thể tranh luận
# - Khi văn bản được sửa đổi, thêm obligations mới, deprecated obligations cũ
# - KHÔNG xoá obligations cũ, đánh dấu deprecated

